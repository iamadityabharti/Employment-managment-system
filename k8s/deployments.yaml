---
# ── Gateway ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: atlas-ems
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: atlas-ems/gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: atlas-ems-config
            - secretRef:
                name: atlas-ems-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: atlas-ems
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 3000

---
# ── Auth Service ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: atlas-ems
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: atlas-ems/auth:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: atlas-ems-config
            - secretRef:
                name: atlas-ems-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-ems-secrets
                  key: DATABASE_URL_AUTH
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: atlas-ems
spec:
  selector:
    app: auth
  ports:
    - port: 3001
      targetPort: 3001

